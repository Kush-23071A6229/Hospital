[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "bandit (>=1.9.4,<2.0.0)"
]

[tool.ruff]
lint.ignore = ["B008"]